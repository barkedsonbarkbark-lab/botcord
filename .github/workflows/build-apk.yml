name: Build Android APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:        # also lets you start a build by hand from the Actions tab

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: System packages
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential git zip unzip autoconf automake libtool \
            pkg-config zlib1g-dev libncurses-dev cmake libffi-dev libssl-dev libltdl-dev

      - name: Python tooling
        run: |
          python -m pip install --upgrade pip
          pip install buildozer "cython==0.29.36" virtualenv

      - name: Cache Android SDK/NDK and build output
        uses: actions/cache@v4
        with:
          path: |
            ~/.buildozer
            .buildozer
          key: buildozer-${{ runner.os }}-${{ hashFiles('buildozer.spec') }}
          restore-keys: |
            buildozer-${{ runner.os }}-

      - name: Build debug APK
        run: |
          set -o pipefail
          buildozer -v android debug 2>&1 | tee build.log

      - name: Show the real error (only if the build failed)
        if: failure()
        run: |
          n=$(grep -n "Command failed" build.log | head -1 | cut -d: -f1)
          echo "=== 150 lines before Buildozer's 'Command failed' ==="
          if [ -n "$n" ]; then sed -n "$((n>150 ? n-150 : 1)),${n}p" build.log; else tail -n 150 build.log; fi

      - name: Upload full build log (only if the build failed)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: botcord-apk
          path: bin/*.apk
          if-no-files-found: error
